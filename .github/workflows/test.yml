name: Test

# On-demand / ad-hoc test workflow, kept separate from release.yml's own
# release-gate test job so it can be run without cutting a release. Two ways
# to trigger it:
#   - workflow_dispatch (optionally against a specific ref), for manual runs.
#   - push of a tag matching "ci-*" (throwaway tag, delete after) so an agent
#     without dashboard access can trigger + poll a run via the API/CLI.
# Not triggered by push/PR on branches by default -- add that only if the
# project actually wants CI on every commit.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
  push:
    tags:
      - "ci-*"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # The gate behind the shipped type promise: formatting, the package's own
    # type contract on every platform, and the documented API checked as a
    # consumer would check it. `py.typed` tells every consumer's checker to
    # trust the annotations, so something has to check them.
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          # The newest Python, and so the newest mypy. The checker targets 3.10
          # (`[tool.mypy] python_version`, the oldest mypy 2 accepts); the 3.9
          # floor is what the test matrix below runs.
          python-version: "3.14"
      - name: Install pktcap 0.1 from its repository (until 0.1.0 is on PyPI)
        # TEMPORARY: the declared requirement, pktcap>=0.1.0, is not published
        # yet. Remove this step when pktcap 0.1.0 is on PyPI.
        run: python -m pip install "pktcap @ git+https://github.com/jose-pr/pktcap@main"
      - name: Install package with all extras
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: python -m black --check src tests benchmarks examples
      - name: Type-check the package for every target platform
        # mypy checks every per-platform branch whatever host it runs on, but
        # resolves names such as `socket.AF_PACKET` against the platform it is
        # told to target: a clean run for one platform says nothing about the
        # others, and an ignore one platform needs is an error on another.
        run: |
          python -m mypy --platform linux src/tftp
          python -m mypy --platform darwin src/tftp
          python -m mypy --platform win32 src/tftp
      - name: Type-check the documented API as a consumer
        # tests/typing/api.py is not a pytest module: nothing runs it, and this
        # step is the only thing that checks it. It uses its own configuration,
        # the one a consumer has, and no cache: two runs on one configuration
        # share `.mypy_cache`, and the second reads the first's package back.
        run: python -m mypy --no-incremental --config-file tests/typing/consumer.ini tests/typing/api.py

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu full matrix over every supported version
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          # Windows/macOS matrix edges (oldest + newest supported)
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pktcap 0.1 from its repository (until 0.1.0 is on PyPI)
        # TEMPORARY: the declared requirement, pktcap>=0.1.0, is not published
        # yet. Remove this step when pktcap 0.1.0 is on PyPI.
        run: python -m pip install "pktcap @ git+https://github.com/jose-pr/pktcap@main"
      - name: Install package with all extras
        # Install every extra that has tests depending on it, or those tests
        # silently skip (pytest.importorskip) instead of actually running.
        run: python -m pip install -e ".[dev]"
      - name: Install TFTP peers for interop tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tftp-hpa tftpd-hpa busybox dnsmasq-base
          sudo systemctl disable --now tftpd-hpa || true
      - name: Run tests
        run: python -m pytest -q -rs

  # The declared floors, exercised: every runtime dependency and feature extra
  # installed AT the lower bound pyproject.toml declares (`>=X.Y.0` -> `==X.Y.0`),
  # on the oldest supported Python. The matrix above only ever gets the newest
  # releases, so a floor that no longer works would otherwise go unnoticed.
  floors:
    name: Test at the declared dependency floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Pin every declared dependency to its floor
        shell: python
        run: |
          import re
          import subprocess
          import sys

          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "tomli"], check=True)
          import tomli

          project = tomli.load(open("pyproject.toml", "rb"))["project"]
          specs = list(project.get("dependencies", []))
          for extra, deps in project.get("optional-dependencies", {}).items():
              if extra not in ("dev", "docs"):
                  specs += deps
          pins = []
          for spec in specs:
              m = re.match(r"^\s*([A-Za-z0-9._-]+)(\[[^\]]*\])?\s*[^;]*?>=\s*([^,;\s]+)", spec)
              if m:
                  pins.append("%s==%s" % (m.group(1), m.group(3)))
          open("floors.txt", "w").write("\n".join(pins) + "\n")
          print("\n".join(pins) or "(no floors declared)")
      - name: Install pktcap 0.1 from its repository (until 0.1.0 is on PyPI)
        # TEMPORARY: the floor, pktcap 0.1.0, is not published yet, so the
        # floor pin below cannot be installed from PyPI. This installs the
        # same version from its repository; the pin then finds it satisfied.
        # Remove this step when pktcap 0.1.0 is on PyPI.
        run: python -m pip install "pktcap @ git+https://github.com/jose-pr/pktcap@main"
      - name: Install at the floors
        run: python -m pip install -c floors.txt -e ".[dev]"
      - name: Install TFTP peers for interop tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tftp-hpa tftpd-hpa busybox dnsmasq-base
          sudo systemctl disable --now tftpd-hpa || true
      - name: Run tests
        run: python -m pytest -q -rs

  # What a user gets from the package alone: no extra and no dev tooling,
  # imported from site-packages and not from the checkout, a loopback transfer,
  # and the `pytftp` script saying which extra it needs.
  bare-install:
    name: Import the bare install (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"] # oldest + newest supported
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pktcap 0.1 from its repository (until 0.1.0 is on PyPI)
        # TEMPORARY: the declared requirement, pktcap>=0.1.0, is not published
        # yet. Remove this step when pktcap 0.1.0 is on PyPI.
        run: python -m pip install "pktcap @ git+https://github.com/jose-pr/pktcap@main"
      - name: Install the package with no extra
        run: python -m pip install .
      - name: Import it, transfer a file and start the script
        # Outside the checkout, so nothing but site-packages can be imported.
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/tests/integration/smoke_installed.py"

  # The built wheel, installed into clean environments on each system: once
  # bare, once with the extras the command and the path classes need, and the
  # installed `pytftp` script run in both.
  wheel:
    name: Built wheel (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"] # oldest + newest supported
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel
          ls dist
      - name: Install the wheel with no extra and run its script
        run: |
          python -m venv "$RUNNER_TEMP/bare"
          BIN="$RUNNER_TEMP/bare/bin"
          [ -d "$RUNNER_TEMP/bare/Scripts" ] && BIN="$RUNNER_TEMP/bare/Scripts"
          # TEMPORARY: the declared requirement, pktcap>=0.1.0, is not published
          # yet. Remove this when pktcap 0.1.0 is on PyPI.
          "$BIN/python" -m pip install "pktcap @ git+https://github.com/jose-pr/pktcap@main"
          "$BIN/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$BIN/python" "$GITHUB_WORKSPACE/tests/integration/smoke_installed.py"
      - name: Install the wheel with its extras and run its script
        run: |
          python -m venv "$RUNNER_TEMP/full"
          BIN="$RUNNER_TEMP/full/bin"
          [ -d "$RUNNER_TEMP/full/Scripts" ] && BIN="$RUNNER_TEMP/full/Scripts"
          # TEMPORARY: see above.
          "$BIN/python" -m pip install "pktcap @ git+https://github.com/jose-pr/pktcap@main"
          "$BIN/python" -m pip install "$(ls dist/*.whl)[cli,path]"
          cd "$RUNNER_TEMP"
          "$BIN/python" "$GITHUB_WORKSPACE/tests/integration/smoke_installed.py" --extras

  # How much of the package the tests run, reported and never gated: a
  # threshold rewards tests written to reach lines. Subprocesses (the command
  # line tests) are not measured.
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install pktcap 0.1 from its repository (until 0.1.0 is on PyPI)
        # TEMPORARY: the declared requirement, pktcap>=0.1.0, is not published
        # yet. Remove this step when pktcap 0.1.0 is on PyPI.
        run: python -m pip install "pktcap @ git+https://github.com/jose-pr/pktcap@main"
      - name: Install package with all extras
        run: python -m pip install -e ".[dev]"
      - name: Install TFTP peers for interop tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tftp-hpa tftpd-hpa busybox dnsmasq-base
          sudo systemctl disable --now tftpd-hpa || true
      - name: Run the tests under coverage
        run: python -m coverage run --source=tftp -m pytest -q -rs
      - name: Report
        run: |
          python -m coverage report --skip-empty
          python -m coverage report --skip-empty --format=markdown >> "$GITHUB_STEP_SUMMARY"
