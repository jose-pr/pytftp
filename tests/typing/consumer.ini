# The configuration a consumer of tftp runs on `tests/typing/api.py`, not the package's own.
#
# The package's `[tool.mypy]` in pyproject.toml adds `disallow_untyped_defs`,
# `warn_unused_ignores` and `warn_redundant_casts`, which a consumer does not set. Checking the
# file with the same options would not show what somebody importing the package sees, and
# running both from one configuration lets the second read the first's `.mypy_cache`. Keeping
# two configurations keeps the two runs apart; the consumer check also passes `--no-incremental`.
#
# `warn_unused_ignores` is on here on purpose: `api.py` marks each call that must be refused
# with `# type: ignore[code]`, so a call that stops being an error shows as an unused ignore.
#
# python_version is the oldest the checker accepts; the 3.9 floor is verified by the test run.
[mypy]
python_version = 3.10
mypy_path = src
warn_unused_ignores = True
