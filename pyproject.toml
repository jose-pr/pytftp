[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license fields need 1.27
build-backend = "hatchling.build"

[project]
name = "tftp"
version = "0.1.0"
authors = [{ name = "jose-pr", email = "jose-pr@coqui.dev" }]
description = "Pure-Python TFTP client and server for IPv4 and IPv6: RFC 1350, 2347, 2348, 2349 and 7440"
readme = "README.md"
requires-python = ">=3.9"
# No license has been chosen yet, so none is declared and the project is
# marked as not uploadable. Add `license`/`license-files` (PEP 639) and drop
# the "Private" classifier once one is picked.
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Topic :: System :: Boot",
    "Typing :: Typed",
]
# netimps supplies pktinfo (replying from the address a request was sent to),
# host:port parsing, socket binding and bind-error hints, and has no
# dependencies of its own. Floor 0.3.3: UdpEndpoint pktinfo on Windows (its
# WSARecvMsg backend) and v4-mapped local addresses on dual-stack sockets.
dependencies = ["netimps>=0.3.3,<0.4"]

[project.optional-dependencies]
# The CLI is optional: importing tftp never requires duho.
cli = ["duho>=0.6.0,<0.7"]
dev = ["black", "build", "pytest", "duho>=0.6.0,<0.7"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.scripts]
pytftp = "tftp.cli:run"

[project.urls]
Homepage = "https://github.com/jose-pr/pytftp/"
Documentation = "https://jose-pr.github.io/pytftp/"
Issues = "https://github.com/jose-pr/pytftp/issues"

# Personal overrides (`*.local.*`) and agent config (`CLAUDE*`) never ship, even
# from a tree without its .gitignore (a copy, an sdist rebuild).
[tool.hatch.build.targets.sdist]
# The repo-root AGENTS.md is contributor orientation for a checkout; the
# consumer docs are src/tftp/AGENTS.md, which ships in the wheel.
exclude = ["/.*", "/benchmarks", "/AGENTS.md", "*.local.*", "CLAUDE*"]

# Explicit, so it works whether or not the import name matches the
# distribution name (hatchling only guesses the matching case).
[tool.hatch.build.targets.wheel]
packages = ["src/tftp"]
exclude = ["*.local.*", "CLAUDE*"]

# Ship the consumer-facing README inside the installed package too, beside the
# API header src/tftp/AGENTS.md (which ships by living in the package).
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "tftp/README.md"

[tool.black]
target-version = ["py39"]
line-length = 110

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: long transfers (block-number rollover); deselect with -m 'not slow'",
    "interop: talks to another TFTP implementation found on PATH",
]
