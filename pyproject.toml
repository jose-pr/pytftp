[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license fields need 1.27
build-backend = "hatchling.build"

[project]
name = "tftp"
version = "0.1.0"
authors = [{ name = "jose-pr", email = "jose-pr@coqui.dev" }]
description = "Pure-Python TFTP client, server, relay and capture decoder for IPv4 and IPv6"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Topic :: System :: Boot",
    "Typing :: Typed",
]
# netimps supplies pktinfo (replying from the address a request was sent to),
# reply sockets, host:port parsing, socket binding and bind-error hints, and has
# no dependencies of its own. The code uses its 0.4 names (`UDPEndpoint`,
# `split_host`, `Host.ip`, `get_interface`) and its keyword-only options
# (`Backoff`, `max_udp_payload`), and needs its link-local IPv6 bind fixes for
# `interface=` with host '::' and for replies to a link-local IPv6 client.
# 0.4.1 is the floor the `pktcap` extra can be installed beside: pktcap needs it.
dependencies = ["netimps>=0.4.1,<0.5"]

[project.optional-dependencies]
# The CLI is optional: importing tftp never requires duho.
cli = ["duho>=0.7.0,<0.8"]
# Captures: pktcap reads pcap and pcapng files, dissects their frames (IP
# fragments reassembled), writes pcap and pcapng, filters and captures live on
# Linux; `pytftp capture` and `pytftp replay` are its commands, and --pcap on
# the other commands writes a capture. Importing tftp never requires it.
pktcap = ["pktcap>=0.1.0,<0.2"]
# pathlib-style paths: TFTPPath, and the tftp:// scheme for pathlib_next's
# UriPath (its "uri" extra). Importing tftp never requires it.
path = ["pathlib-next[uri]>=0.9.12,<0.10"]
# Tooling only: the extras the tests need are named here, their ranges are above.
dev = ["black", "build", "coverage", "mypy>=1.19,<3", "pytest", "tftp[cli,path,pktcap]"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.scripts]
pytftp = "tftp.cli:main"

# So pathlib_next.uri.UriPath("tftp://...") finds TFTPURIPath without an import.
[project.entry-points."pathlib_next.schemes"]
tftp = "tftp.path:TFTPURIPath"

[project.urls]
Homepage = "https://github.com/jose-pr/pytftp/"
Documentation = "https://jose-pr.github.io/pytftp/"
Issues = "https://github.com/jose-pr/pytftp/issues"

# Personal overrides (`*.local.*`) and agent config (`CLAUDE*`) never ship, even
# from a tree without its .gitignore (a copy, an sdist rebuild).
[tool.hatch.build.targets.sdist]
# The repo-root AGENTS.md is contributor orientation for a checkout; the
# consumer docs are src/tftp/AGENTS.md, which ships in the wheel.
exclude = ["/.*", "/benchmarks", "/AGENTS.md", "*.local.*", "CLAUDE*"]

# Explicit, so it works whether or not the import name matches the
# distribution name (hatchling only guesses the matching case).
[tool.hatch.build.targets.wheel]
packages = ["src/tftp"]
exclude = ["*.local.*", "CLAUDE*"]

# Ship the consumer-facing README inside the installed package too, beside the
# API header src/tftp/AGENTS.md (which ships by living in the package).
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "tftp/README.md"

[tool.black]
target-version = ["py39"]
# The project's choice, not the reference's default: lines of up to 110 columns.
line-length = 110

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Warnings are errors; nothing is excepted.
filterwarnings = ["error"]
markers = [
    "slow: long transfers (block-number rollover); deselect with -m 'not slow'",
    "interop: talks to another TFTP implementation found on PATH",
    "resolves_off_host: the test of the conftest guard that refuses a name that would leave the host",
]

[tool.mypy]
# mypy 2 no longer accepts a 3.9 target, so the checker runs at 3.10 and the
# 3.9 floor is verified by running the test suite there, with a test that
# resolves every public annotation on it. Default settings, plus a complete
# annotation on every function and no ignore or cast that does nothing.
# `tests/typing/consumer.ini` is the configuration of a consumer of the package.
python_version = "3.10"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
